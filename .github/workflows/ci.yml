name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    # Fetches the pinned BotControllerApi, runs the logic tests, publishes and packs the plugin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZeBots
          path: dist/ZeBots.tar.gz
          if-no-files-found: error
