name: Release

# Push a tag v<Version> (Version is in Directory.Build.props) to publish dist/ZeBots.tar.gz as a
# GitHub release. The asset keeps the name ZeBots.tar.gz so consumers can fetch
# .../releases/latest/download/ZeBots.tar.gz.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Tag matches Version
        run: |
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match <Version>${version}</Version> in Directory.Build.props" >&2
            exit 1
          fi
      - run: ./build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Consumers pin this digest next to the version they download.
          (cd dist && sha256sum ZeBots.tar.gz > ZeBots.tar.gz.sha256)
          gh release create "${GITHUB_REF_NAME}" dist/ZeBots.tar.gz dist/ZeBots.tar.gz.sha256 \
            --title "${GITHUB_REF_NAME}" --generate-notes
